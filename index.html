    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t =
            window.matchMedia &&
            matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
